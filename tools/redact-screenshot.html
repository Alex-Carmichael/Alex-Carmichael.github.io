<!-- Regenerates public/media/case-01-storefront.png from the raw capture.
     Put the 1600x920 original alongside this file as sls-1600.png, then:
       chrome --headless --hide-scrollbars --window-size=1600,920 \
         --screenshot=case-01-storefront.png file://$PWD/redact-screenshot.html
     The fills are solid, not blurred: blurred text stayed legible at this scale. -->
<!doctype html><html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box} body{margin:0;width:1600px;height:920px;overflow:hidden}
  .wrap{position:relative;width:1600px;height:920px}
  img{display:block;width:1600px;height:920px}
  .fill{position:absolute;background:#D1FEE3}
  .chip{position:absolute;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
  .chip span{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.14em;
             text-transform:uppercase;color:#9AA0A6;border:1px dashed #C9CDD3;border-radius:3px;
             padding:9px 14px;background:#F6F6F4}
</style></head><body><div class="wrap">
  <img src="sls-1600.png">
  <div class="fill" style="left:236px;top:206px;width:350px;height:112px;"></div>
  <div class="fill" style="left:236px;top:328px;width:352px;height:74px;"></div>
  <div class="chip" style="left:238px;top:8px;width:176px;height:62px;"><span>client</span></div>
</div></body></html>
